<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#14151a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="spike">
<title>spike</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">

  <!-- Anmeldung -->
  <section id="login" hidden>
    <div class="login-box">
      <div class="logo"><i>s</i>spike</div>
      <p>Gib den Schlüssel ein, den spike am PC unter <b>⚙ Einstellungen → Handy</b> zeigt. Oder scanne dort den QR-Code.</p>
      <form id="loginForm">
        <input id="loginToken" autocomplete="current-password" placeholder="Schlüssel" autocapitalize="off" spellcheck="false">
        <button class="primary" type="submit">Verbinden</button>
      </form>
      <small id="loginErr" class="err"></small>
    </div>
  </section>

  <!-- Chat -->
  <section id="main" hidden>
    <header class="top">
      <button class="ib" id="menuBtn" aria-label="Chatliste öffnen">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <div class="t"><b id="chatTitle">Neuer Chat</b><small id="conn"><span class="dot"></span><span id="connText">Verbinde …</span></small></div>
      <button class="ib" id="newTop" aria-label="Neuer Chat">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </header>

    <main class="chat" id="chat" aria-live="polite"></main>

    <footer class="foot">
      <div class="atts" id="atts"></div>
      <div class="meta">
        <button id="modelBtn" aria-label="Modell wählen"><span id="mLabel">…</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
        <span class="sep">·</span>
        <button id="profileBtn" aria-label="Profil wählen"><span id="pLabel">…</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
        <span class="sp" id="speed"></span>
      </div>
      <div class="composer">
        <button class="cb" id="attachBtn" aria-label="Datei oder Foto anhängen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Nachricht an spike …" enterkeyhint="send"></textarea>
        <button class="cb mic" id="mic" aria-label="Gedrückt halten zum Sprechen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="cb send" id="send" aria-label="Senden">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <button class="cb stop" id="stop" aria-label="Antwort abbrechen" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>
        </button>
      </div>
      <input type="file" id="fileIn" multiple hidden>
      <input type="file" id="audioIn" accept="audio/*" capture hidden>
    </footer>

    <div class="rec" id="rec" hidden><span class="rd"></span><canvas class="wave" id="wave"></canvas><small id="recT">0:00</small></div>

    <div class="scrim" id="scrim"></div>
    <nav class="drawer" aria-label="Chats">
      <div class="dh"><b><i>s</i>spike</b><button class="newb" id="newChat">＋ Neu</button></div>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Chats durchsuchen" type="search"></label>
      <div class="list" id="list"></div>
      <div class="df">
        <button class="arch" id="archBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/></svg><span id="archText">Archiv</span></button>
        <div class="conn"><span class="dot"></span><div id="connBig">…</div></div>
      </div>
    </nav>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
    <div class="push" id="push" role="status"><i>s</i><div><b id="pushT">spike</b><small>jetzt</small><p id="pushB"></p></div></div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
